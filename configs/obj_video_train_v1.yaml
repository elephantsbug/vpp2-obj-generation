# User-authorized first full run after the corrected GAS=8 GPU smoke test.
_base_: obj_video_baseline_v1.yaml
output_dir: ${paths.project}/runs/obj_video_train_v1
batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
warmup_steps: 200
max_steps: 10000
